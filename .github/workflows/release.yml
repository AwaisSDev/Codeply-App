name: Build & Release

on:
  push:
    tags:
      - 'v*'

# GitHub's modern default gives the auto-generated GITHUB_TOKEN read-only
# access, which is what "Resource not accessible by integration" means when
# a job tries to create a release — this grants write explicitly regardless
# of the repo/org default.
permissions:
  contents: write

# Both jobs use electron-builder's own `--publish always`, which is what
# correctly generates AND uploads latest.yml/latest-mac.yml — the metadata
# electron-updater reads to detect new versions. (An earlier version of this
# workflow split build and publish into separate steps to dodge a race
# between the two OS jobs, but that meant nobody ever generated/uploaded
# those .yml files, silently breaking auto-update — 404 on latest.yml.)
#
# The actual fix for the race is just running build-mac AFTER build-windows
# (`needs:`) instead of in parallel: two `--publish always` calls for the
# same tag running at once can both decide "no release exists yet" before
# either has created one, so both create a SEPARATE release. Sequenced, the
# second call finds the first job's release and adds its assets to it.
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build & publish Windows
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx electron-builder --win --publish always

  build-mac:
    needs: build-windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build & publish Mac
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx electron-builder --mac --publish always
